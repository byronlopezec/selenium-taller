plugins {
    id 'java'
}

group 'com.tcs'
version '1.0'

repositories {
    mavenCentral()
}

dependencies {
    // Dependencia de Selenium
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.30.0'

    // Dependencias de JUnit 5 (Jupiter)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.12.0' // API de JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.12.0' // Motor de JUnit 5 para ejecutar pruebas

    // Dependencia para lanzar pruebas con JUnit Platform
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.0' // Lanzador de JUnit Platform
}

test {
    useJUnitPlatform()
}

test {
    useJUnitPlatform()
}